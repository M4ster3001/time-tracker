name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: time_tracker_test
          MYSQL_USER: test
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://test:ci-test-only@127.0.0.1:3306/time_tracker_test
      SHADOW_DATABASE_URL: mysql://test:ci-test-only@127.0.0.1:3306/time_tracker_test_shadow
      JWT_SECRET: ci-only-test-key-never-use-in-production-2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run db:generate --workspace=backend
      - run: npm run db:migrate --workspace=backend
      - run: npm run type-check
      - run: npm run lint:ci
      - run: npm run test --workspace=backend -- --maxWorkers=2
      - run: npm run test --workspace=frontend -- --maxWorkers=2
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=frontend
      - run: npm run release:check
