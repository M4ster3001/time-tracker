services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the root .env}
      MYSQL_DATABASE: time_tracker
      MYSQL_USER: ${MYSQL_USER:-time_tracker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the root .env}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./backend/.env.docker
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: mysql://${MYSQL_USER:-time_tracker_user}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the root .env}@mysql:3306/time_tracker
      SHADOW_DATABASE_URL: ''
      BACKUP_LOCAL_PATH: /app/backups
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    volumes:
      # Named volume by default (works on Linux, macOS, Windows and filesystems
      # without chown such as vfat/exFAT/network shares). Set BACKUP_HOST_PATH to
      # a folder path to store backups on the host instead.
      - ${BACKUP_HOST_PATH:-backups_data}:/app/backups
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:5000/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    profiles: ['redis']
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    driver: local
  backups_data:
    driver: local

networks:
  app-network:
    driver: bridge
